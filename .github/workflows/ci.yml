name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: how-measures-lie
      - uses: actions/checkout@v4
        with:
          repository: parallaxmetrology/notan
          path: notan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy scikit-image Pillow matplotlib
      - run: python demos/make_figures.py
        working-directory: how-measures-lie
      - run: python build_page.py
        working-directory: how-measures-lie
