name: A failure mode to add
description: An image measure that returned a plausible, wrong number without an error
labels: [failure-mode]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The measure, the input, the number it gave, and the right answer.
    validations:
      required: true
  - type: textarea
    id: caught
    attributes:
      label: How it was caught
      description: The control, check or known-answer input that exposed it.
    validations:
      required: true
